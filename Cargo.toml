[package]
name = "sila-printer"
version = "0.1.0"
edition = "2024"

[dependencies]
prost = "0.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }
tokio-stream = "0.1"
tonic = "0.14"
tonic-prost = "0.14"
uuid = { version = "1.26.1", features = ["v4"] }

[build-dependencies]
tonic-prost-build = "0.14"
