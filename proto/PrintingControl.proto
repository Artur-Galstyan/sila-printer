syntax = "proto3";

import "SiLAFramework.proto";

package sila2.org.silastandard.printer.silaprintingcontrol.v1;

/* Provides a set of commands for controlling the printer */
service SiLAPrintingControl {
  /* Prints a document. Upload the file with the SiLA Binary Upload feature first, then pass its binaryTransferUUID here. */
  rpc Print (sila2.org.silastandard.printer.silaprintingcontrol.v1.Print_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of Print */
  rpc Print_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve result of Print */
  rpc Print_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.org.silastandard.printer.silaprintingcontrol.v1.Print_Responses) {}
  /* Starts the scanning process. */
  rpc StartScanning (sila2.org.silastandard.printer.silaprintingcontrol.v1.StartScanning_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of StartScanning */
  rpc StartScanning_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve result of StartScanning */
  rpc StartScanning_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.org.silastandard.printer.silaprintingcontrol.v1.StartScanning_Responses) {}
  /* Stops the scanning process. */
  rpc StopScanning (sila2.org.silastandard.printer.silaprintingcontrol.v1.StopScanning_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of StopScanning */
  rpc StopScanning_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve result of StopScanning */
  rpc StopScanning_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.org.silastandard.printer.silaprintingcontrol.v1.StopScanning_Responses) {}
  /* The current status of the printer. */
  rpc Subscribe_CurrentPrinterStatus (sila2.org.silastandard.printer.silaprintingcontrol.v1.Subscribe_CurrentPrinterStatus_Parameters) returns (stream sila2.org.silastandard.printer.silaprintingcontrol.v1.Subscribe_CurrentPrinterStatus_Responses) {}
}

/* Parameters for Print */
message Print_Parameters {
  sila2.org.silastandard.String File = 1;  /* The binaryTransferUUID of the file uploaded with the SiLA Binary Upload feature. */
}

/* Responses of Print */
message Print_Responses {
  message PrintResult_Struct {
    sila2.org.silastandard.Integer PrintStatus = 1;  /* Status of the print operation. */
    sila2.org.silastandard.String PrintMessage = 2;  /* Message related to the print operation. */
  }
  sila2.org.silastandard.printer.silaprintingcontrol.v1.Print_Responses.PrintResult_Struct PrintResult = 1;  /* Result of the print operation. */
}

/* Parameters for StartScanning */
message StartScanning_Parameters {
}

/* Responses of StartScanning */
message StartScanning_Responses {
  message ScanResult_Struct {
    sila2.org.silastandard.Integer ScanStatus = 1;  /* Status of the scan operation. */
    sila2.org.silastandard.String ScanMessage = 2;  /* Message related to the scan operation. */
  }
  sila2.org.silastandard.printer.silaprintingcontrol.v1.StartScanning_Responses.ScanResult_Struct ScanResult = 1;  /* Result of the scan operation. */
}

/* Parameters for StopScanning */
message StopScanning_Parameters {
}

/* Responses of StopScanning */
message StopScanning_Responses {
  sila2.org.silastandard.Integer ScanningStatus = 1;  /* Status of the scanning operation. */
}

/* Parameters for CurrentPrinterStatus */
message Subscribe_CurrentPrinterStatus_Parameters {
}

/* Responses of CurrentPrinterStatus */
message Subscribe_CurrentPrinterStatus_Responses {
  sila2.org.silastandard.String CurrentPrinterStatus = 1;  /* The current status of the printer. */
}
